
name: Testar DeepSeek Super-Agent

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar Super-Agent
        run: pnpm run build

      - name: Confirmacao
        run: echo "Compilacao concluida!"
